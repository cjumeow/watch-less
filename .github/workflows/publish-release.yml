# Publishes a GitHub release when a version tag is pushed, with the tag's section of CHANGELOG.md as its notes. How to
# cut a release is in .claude/skills/commit-and-pull-request-convention/SKILL.md, Releases.
name: publish-release

on:
  push:
    tags: ["v*"]

# Creating a release writes to the repository.
permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # A release is a commit on main that its release pull request put there, never one only on a branch.
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check that the tag matches the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match package.json's version $version."
            exit 1
          fi
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
