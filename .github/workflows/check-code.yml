# Runs every check in `npm run check` on a pull request and on main, one step each so a failure names its check.
name: check-code

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run it makes obsolete. Runs on main are never cancelled, so every
# merged commit ends green or red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request that changes only documentation skips the checks below, none of which reads Markdown. The job
      # still runs and passes, because check-code is a required check: skipping the whole workflow with `paths-ignore`
      # would leave it pending and block the merge. Pushes to main always run everything.
      - name: Decide whether this change needs the code checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$(node scripts/check-docs-only.mjs "$BASE_SHA" "$HEAD_SHA")" = "true" ]; then
            echo "This pull request changes only documentation, so the code checks are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: npm run format:check
      - if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - if: steps.scope.outputs.code == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.code == 'true'
        run: npm test
      - if: steps.scope.outputs.code == 'true'
        run: npm run build
      # The end-to-end tests load the built extension in Playwright's own Chromium, so they run after the build. Its
      # download is cached by Playwright's version. `--with-deps` is not used: it installs fonts and xvfb through apt,
      # whose Azure mirror has stalled runs for half an hour, and the runner image already has Chromium's libraries.
      - if: steps.scope.outputs.code == 'true'
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.scope.outputs.code == 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - if: steps.scope.outputs.code == 'true'
        run: npm run test:e2e
