<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How yt-digest runs: from YouTube's video menu to a card in Heptabase</title>
  <style>
    .label { fill: #57606a; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .note { fill: #57606a; font-size: 12px; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .label, .note { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .title { fill: #f0f6fc; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z" />
    </marker>
  </defs>

  <text class="label" x="20" y="28">IN CHROME</text>
  <text class="label" x="440" y="28">ON THIS MAC</text>

  <!-- Row 1: the request -->
  <rect class="box" x="20" y="42" width="190" height="70" rx="10" />
  <text class="title" x="115" y="72" text-anchor="middle">YouTube</text>
  <text class="note" x="115" y="94" text-anchor="middle">⋮ menu → Summarize</text>

  <rect class="box" x="230" y="42" width="190" height="70" rx="10" />
  <text class="title" x="325" y="72" text-anchor="middle">Extension</text>
  <text class="note" x="325" y="94" text-anchor="middle">+ language, model from popup</text>

  <rect class="box" x="440" y="42" width="190" height="70" rx="10" />
  <text class="title" x="535" y="72" text-anchor="middle">Native host</text>
  <text class="note" x="535" y="94" text-anchor="middle">Native Messaging</text>

  <rect class="box" x="650" y="42" width="190" height="70" rx="10" />
  <text class="title" x="745" y="72" text-anchor="middle">Queue</text>
  <text class="note" x="745" y="94" text-anchor="middle">one file per video</text>

  <path class="arrow" d="M 210 77 H 228" marker-end="url(#arrow)" />
  <path class="arrow" d="M 420 77 H 438" marker-end="url(#arrow)" />
  <path class="arrow" d="M 630 77 H 648" marker-end="url(#arrow)" />

  <!-- From the queue down to the worker -->
  <path class="arrow" d="M 745 112 V 150 H 115 V 196" marker-end="url(#arrow)" />
  <text class="note" x="430" y="142" text-anchor="middle">launchd starts the worker when the queue changes</text>

  <!-- Row 2: the digest -->
  <rect class="box" x="20" y="198" width="190" height="70" rx="10" />
  <text class="title" x="115" y="228" text-anchor="middle">Worker</text>
  <text class="note" x="115" y="250" text-anchor="middle">one video at a time</text>

  <rect class="box" x="230" y="198" width="190" height="70" rx="10" />
  <text class="title" x="325" y="228" text-anchor="middle">Transcript</text>
  <text class="note" x="325" y="250" text-anchor="middle">yt-dlp captions or Whisper</text>

  <rect class="box" x="440" y="198" width="190" height="70" rx="10" />
  <text class="title" x="535" y="228" text-anchor="middle">Summary</text>
  <text class="note" x="535" y="250" text-anchor="middle">claude -p or codex exec</text>

  <rect class="box" x="650" y="198" width="190" height="70" rx="10" />
  <text class="title" x="745" y="228" text-anchor="middle">Heptabase</text>
  <text class="note" x="745" y="250" text-anchor="middle">a card, then a notification</text>

  <path class="arrow" d="M 210 233 H 228" marker-end="url(#arrow)" />
  <path class="arrow" d="M 420 233 H 438" marker-end="url(#arrow)" />
  <path class="arrow" d="M 630 233 H 648" marker-end="url(#arrow)" />

  <text class="note" x="430" y="308" text-anchor="middle">Your own Claude or ChatGPT plan, signed in on this Mac. No API key, no server.</text>
</svg>
